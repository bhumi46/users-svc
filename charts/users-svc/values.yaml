replicaCount: 1

image:
  repository: ghcr.io/bhumi46/users-svc
  # Overridden per environment in gitops (envs/<env>/users-svc/values.yaml) with the commit SHA.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80

containerPort: 8080

# Extra environment variables (name: value).
env:
  LOG_LEVEL: info

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
